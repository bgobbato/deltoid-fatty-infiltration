# Server: nginx (HTTPS + basic auth) -> 127.0.0.1:18090
#   cd /opt/dfdi && docker compose -f docker-compose.vps.yml up -d --build
services:
  dfdi:
    build: .
    image: dfdi:vps
    container_name: dfdi
    user: "10001:10001"            # dedicated uid, not shared with other services
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - /opt/dfdi/data:/data
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4
